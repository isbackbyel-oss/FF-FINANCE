<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>FF Finance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loading" class="loading"><div class="spinner"></div></div>

  <!-- TELA DE LOGIN -->
  <main id="tela-login" class="tela hidden">
    <div class="login-card">
      <div class="logo">FF</div>
      <h1>FF <span>Finance</span></h1>
      <p class="sub">Controle financeiro a dois</p>

      <label for="usuario">Nome de usuário</label>
      <input id="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex: joao_ff" maxlength="20">

      <label for="senha">Senha</label>
      <div class="senha-wrap">
        <input id="senha" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres">
        <button type="button" id="ver-senha" class="olho" aria-label="Mostrar senha">👁</button>
      </div>

      <div id="confirmar-wrap" class="hidden">
        <label for="senha2">Confirmar senha</label>
        <input id="senha2" type="password" autocomplete="new-password" placeholder="repita a senha">
      </div>

      <p id="erro" class="erro" role="alert"></p>

      <button id="btn-entrar" class="btn primario">Entrar</button>
      <button id="btn-criar" class="btn secundario">Criar conta</button>
      <button id="btn-esqueci" class="link">Esqueci minha senha</button>
    </div>
  </main>

  <!-- TELA PRINCIPAL (provisória; as abas entram na próxima etapa) -->
  <main id="tela-app" class="tela hidden">
    <div class="login-card">
      <div class="logo">FF</div>
      <h1>Olá, <span id="nome-logado"></span>!</h1>
      <p class="sub">Login funcionando ✅<br>Próxima etapa: telas do app.</p>
      <button id="btn-sair" class="btn secundario">Sair</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="auth.js"></script>
</body>
</html>
